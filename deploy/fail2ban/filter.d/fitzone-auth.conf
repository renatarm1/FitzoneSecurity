# Filtro de fail2ban para los eventos de seguridad propios de FitZone
# (login fallido, reCAPTCHA inválido, registro con correo duplicado, checkout con
# datos manipulados, etc.). Todos esos logger.warning(...) en el código Django
# terminan con "(IP: <ip>)" a propósito, para que este filtro los pueda capturar.
#
# Instalar en: /etc/fail2ban/filter.d/fitzone-auth.conf

[Definition]
failregex = ^.*SECURITY ALERT.*\(IP: <HOST>\)\s*$
ignoreregex =
