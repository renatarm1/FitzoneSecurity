# Jails de fail2ban para FitZone.
# Instalar en: /etc/fail2ban/jail.d/fitzone.conf
# (el filtro fitzone-auth.conf va en /etc/fail2ban/filter.d/, ver deploy/fail2ban/filter.d/)

[fitzone-auth]
enabled  = true
filter   = fitzone-auth
logpath  = /var/www/fitzone/logs/application.log
# 5 eventos "SECURITY ALERT" de la misma IP en 5 minutos -> ban de 1 hora
maxretry = 5
findtime = 300
bantime  = 3600
action   = %(action_)s

# Jail incluido de fábrica en fail2ban: detecta escaneo de rutas típicas de ataque
# (wp-login.php, phpmyadmin, .env, etc.) leyendo el access.log de Nginx.
[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 300
bantime  = 3600
